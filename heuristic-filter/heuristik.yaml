rules:
  - name: ignore-previous
    category: instruction-override
    score: 0.85
    pattern: 'ignore\s+(all\s+)?(previous|prior|earlier)\s+instructions'
    enabled: true

  - name: dan-mode
    category: role-play
    score: 0.9
    pattern: 'DAN|do\s+anything\s+now|no\s+restrictions'
    enabled: true

  - name: system-prompt-extract
    category: system-prompt-leakage
    score: 0.8
    pattern: 'repeat\s+(everything|your\s+instructions|(the\s+|your\s+)?system\s+prompt)'
    enabled: true

  - name: forget-previous
    category: instruction-override
    score: 0.85
    pattern: 'forget\s+(about\s+)?(all\s+)?(the\s+)?(previous|prior|above|everything|assignments|tasks|instructions)'
    enabled: true

  - name: ignore-variants
    category: instruction-override
    score: 0.8
    pattern: 'ignore\s+(the\s+above|all\s+preceding|above)'
    enabled: true

  - name: new-task-switch
    category: instruction-override
    score: 0.75
    pattern: '(now\s+)?(new|further)\s+(task|instruction|challenge)s?\s+(follow|are)'
    enabled: true

  - name: act-as-roleplay
    category: role-play
    score: 0.7
    pattern: '(i\s+want\s+you\s+to\s+act\s+as|pretend\s+you\s+are|now\s+you\s+are)'
    enabled: true

  - name: prompt-extraction
    category: system-prompt-leakage
    score: 0.85
    pattern: '(show|reveal|display|output|repeat)\s+(me\s+)?(all\s+)?your\s+(prompt|system\s+prompt|instructions)'
    enabled: true

  - name: praise-then-pivot
    category: instruction-override
    score: 0.70
    pattern: '(very\s+well\s+done|well\s+done|simply\s+great|outdone\s+yourself|that\s+was\s+ok\s+before|excellent\s+performance|great\s+job)'
    enabled: true

  - name: task-pivot-now
    category: instruction-override
    score: 0.60
    pattern: '\b(now|but\s+now)\s+(please\s+)?(help|focus|concentrate|answer|write|do|come\s+on|new\s+task)'
    enabled: true

  - name: urgency-help
    category: instruction-override
    score: 0.65
    pattern: '(urgently\s+need\s+your\s+help|attention\s*[-—]\s*stop)'
    enabled: true

  - name: narrative-roleplay
    category: role-play
    score: 0.65
    pattern: '(are\s+two\s+actors|plays?\s+the\s+(master|role)|in\s+a\s+film\s+about)'
    enabled: true

  - name: institutional-roleplay
    category: role-play
    score: 0.6
    pattern: 'you\s+are\s+(volkswagen|mercedes|bmw|apple|google|microsoft|tesla)'
    enabled: true

  - name: leave-behind
    category: instruction-override
    score: 0.75
    pattern: '(leave\s+(all\s+)?(the\s+)?previous\s+information\s+behind|remove\s+all\s+previous\s+tasks\s+out)'
    enabled: true

  - name: few-shot-injection
    category: instruction-override
    score: 0.75
    pattern: '(input\s*:\s*\w+\s*output\s*:\s*\w+.*){2,}'
    enabled: true

  - name: narrative-film-roleplay
    category: role-play
    score: 0.6
    pattern: '(ever\s+seen\s+a\s+film|scene\s+where|plays?\s+the\s+(leader|role|part|thief))'
    enabled: true

  - name: padding-injection
    category: instruction-override
    score: 0.6
    pattern: '(\\n\s*){5,}'
    enabled: true